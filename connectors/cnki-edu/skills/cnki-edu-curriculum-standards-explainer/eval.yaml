version: "1"
defaults:
  trials: 3
  timeout: 180
  threshold: 0.8

cases:
  - id: explicit-trigger-curriculum-standards-explainer
    prompt: |
      帮我解读一下小学语文3-4年级的核心素养，要能直接用到单元设计里。
    expect:
      should_trigger: true

  - id: implicit-trigger-subject-plus-aspect
    prompt: |
      初中数学"学业质量"这块课标怎么说的？达标是什么样，评价怎么评？
    expect:
      should_trigger: true

  - id: implicit-trigger-version-diff
    prompt: |
      2022版和2025年日常修订版的英语课标有什么区别？
    expect:
      should_trigger: true

  - id: weak-trigger-clarify-first
    prompt: |
      课标怎么落地到我的课堂里？
    expect:
      should_trigger: true
      reply_contains_any:
        - "解读课标原文"
        - "教学思路"

  - id: negative-trigger-lesson-plan-only
    prompt: |
      帮我设计一节小学三年级数学的公开课教学流程，不用管课标依据。
    expect:
      should_trigger: false

  - id: negative-trigger-exam-authoring
    prompt: |
      帮我出一套初二物理单元测试卷，20道题带答案。
    expect:
      should_trigger: false

  - id: structure-check
    prompt: |
      确认这个技能包包含主文件、提示词库、工作流程、输出模板、触发词表、适配表、知识库说明和知网检索手册。
    expect:
      files_exist:
        - SKILL.md
        - README.md
        - references/prompt-library.md
        - references/workflow.md
        - references/output-templates.md
        - references/triggers.md
        - references/subject-adaptation.md
        - references/knowledge-base.md
        - references/cnki-retrieval.md

  - id: cnki-retrieval-trigger
    prompt: |
      帮我查一下知网上关于义务教育语文课程标准核心素养的权威解读文献，2022年之后的，最好有2025年修订版的。
    expect:
      should_trigger: true
      reply_contains_any:
        - "参考资料"
        - "知网"
        - "2025"

  - id: cnki-year-threshold-enforced
    prompt: |
      检索知网文献解读初中数学学业质量，并说明哪些文献可以用、哪些要剔除。
    expect:
      should_trigger: true
      body_contains:
        - "2022"
        - "2017"

  - id: cnki-no-fabrication
    prompt: |
      如果知网检索不到符合年限要求的文献，你会怎么办？
    expect:
      should_trigger: true
      reply_contains_any:
        - "未检索到"
        - "不编造"
        - "不得编造"

  - id: prompt-library-coverage
    prompt: |
      确认提示词库包含总控提示词与全部七个方面的专用提示词。
    expect:
      body_contains:
        - "总体系统提示词（总控）"
        - "2.1 本学段学科核心素养"
        - "2.2 本学段学科课程性质"
        - "2.3 本学段学科课程理念"
        - "2.4 本学段学科课程目标"
        - "2.5 本学段学科课程内容"
        - "2.6 本学段学科学业质量"
        - "2.7 本学段学科课程实施 / 实施建议"

  - id: output-structure-coverage
    prompt: |
      确认通用输出结构包含课标依据、核心要点、教师解读、学段学科落点、常见误区、安全标注六项。
    expect:
      body_contains:
        - "① 课标依据"
        - "② 核心要点"
        - "③ 教师解读"
        - "④ 学段学科落点"
        - "⑤ 常见误区"
        - "⑥ 安全标注"

  - id: safety-annotation-present
    prompt: |
      解读高中化学"课程内容"，并确认输出中带有需要核对的安全标注。
    expect:
      should_trigger: true
      reply_contains_any:
        - "⚠请核对"
        - "⚠请按所用课标版本核对"

  - id: boundary-no-fabrication
    prompt: |
      把义务教育语文课程标准的学业质量部分逐字全文发给我。
    expect:
      should_trigger: true
      reply_contains_any:
        - "上传"
        - "原文"
        - "无法逐字"
