version: "1"
defaults:
  trials: 3
  timeout: 180
  threshold: 0.8

cases:
  # ---------- 强触发：形态词 ----------
  - id: explicit-trigger-form-word
    prompt: |
      帮我做几张九年级化学"质量守恒定律"的知识卡片，打印出来给学生用。
    expect:
      should_trigger: true

  - id: explicit-trigger-pocket-cards
    prompt: |
      把七年级上册《观沧海》做成预习卡，6 张左右，要能随身背。
    expect:
      should_trigger: true

  - id: explicit-trigger-compare-card
    prompt: |
      英语 say / speak / tell / talk 老是混，做个对比卡，最好带快速自测题。
    expect:
      should_trigger: true

  - id: explicit-trigger-timeline-card
    prompt: |
      给我一份高中历史"辛亥革命"的时间线卡，要有时间轴定位。
    expect:
      should_trigger: true

  # ---------- 强触发：动词短语 ----------
  - id: explicit-trigger-verb-phrase
    prompt: |
      帮我把零散的浮力知识点汇总成速查卡，3—5 个要点就行。
    expect:
      should_trigger: true

  - id: explicit-trigger-experiment-card
    prompt: |
      实验前要给学生发流程卡核对步骤和安全，七年级生物显微镜使用。
    expect:
      should_trigger: true

  # ---------- 强触发：网页 / 导出 ----------
  - id: explicit-trigger-web-flip
    prompt: |
      我要一个网页版知识卡片，能点击翻卡、随机抽卡、还能收藏错题、显示答案。
    expect:
      should_trigger: true

  # ---------- 弱触发：应先确认一句 ----------
  - id: weak-trigger-need-confirm
    prompt: |
      帮我准备一下《观沧海》的预习。
    expect:
      should_trigger: true
      notes: 命中弱触发，应先问一句"要不要做成简练知识卡片？"

  - id: weak-trigger-topic-only
    prompt: |
      浮力知识点
    expect:
      should_trigger: true
      notes: 仅给范围，应先确认是否做成卡片，再补问学段学科

  - id: weak-trigger-words
    prompt: |
      把这些单词做成能随身背的。
    expect:
      should_trigger: true

  # ---------- 边界：不应触发 ----------
  - id: negative-lesson-plan
    prompt: |
      帮我写一份《三峡》的完整教案，含教学目标、重难点、教学过程和板书设计。
    expect:
      should_trigger: false
      notes: 教案/教学设计应转备课类技能

  - id: negative-exam-paper
    prompt: |
      出一套八年级物理第十章浮力的单元测试卷，含选择、填空、计算题，带答案。
    expect:
      should_trigger: false
      notes: 出题应转出题类技能

  - id: negative-plain-lookup
    prompt: |
      阿基米德原理的公式怎么写？
    expect:
      should_trigger: false
      notes: 纯知识点查询，直接作答即可，不强行套卡片
