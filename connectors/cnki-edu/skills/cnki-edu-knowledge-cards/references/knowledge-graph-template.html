<!DOCTYPE html>
<html lang="zh-CN" data-style="mindmap">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 · 贴纸手帐风模板</title>
<!--
  ======================================================================
  知识图谱 / 思维导图 / 思维外化图 · 贴纸手帐风模板（cnki-edu-knowledge-cards）
  ----------------------------------------------------------------------
  设计目标：告别"一个方框一个方框"的单调排版，中小学知识图谱应当——
    ① 中心节点 = 发光"星球/主角"气泡（不是方框）；
    ② 主分支 = 绕中心均匀分布的彩色"贴纸"节点，用曲线胶带连线；
    ③ 详细卡片 = 手帐贴纸卡：彩色横幅标题 + 凸起 emoji 徽章 + 胶带角 + 轻微旋转；
    ④ 重点 = 金色"★重点"星标贴纸，不是普通小字；
    ⑤ 背景有星点 / 圆点 / 涂鸦装饰，元素丰富多彩、生动有趣。
  纯 HTML/CSS/JS，零外部依赖，可离线打开、可打印（A4 横向导出 PDF）。
  ----------------------------------------------------------------------
  使用方式：把下面 <script> 里的 const GRAPH = {...} 换成本次知识点数据即可，
  不要重写渲染逻辑。GRAPH 字段：
    title    图谱标题
    subtitle 副标题（学段·学科·册次·课次）
    tags     顶部标签数组，如 ["学段：高中","学科：地理"]
    note     图角诚信/核对说明（建议保留"⚠ 请按所用教材版本核对"）
    theme/theme2  页头与中心节点渐变主色（hex）
    center   {emoji, label(可含\n换行), sub}
    branches 数组，每项 {ix, icon, title, color, sub(hero副标), points:[{text, key?}], tip?}
              color 为该分支主色（hex），节点/横幅/胶带都会跟随；
              point 的 key:true 会渲染成金色"★重点"星标贴纸。
  ======================================================================
-->
<style>
  :root{
    --bg-1:#fef6ec; --bg-2:#eef4ff;
    --panel:#ffffff;
    --text:#2b3340; --muted:#7a8392;
    --line:#e7e0d4;
    --theme:#3b6fd4; --theme-2:#1f3c7a;
    --key:#e0a400; --key-soft:#fff4cf;
    --radius:18px;
    --shadow:0 10px 26px rgba(60,80,140,.14);
    --shadow-pop:0 16px 34px rgba(60,80,140,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 8% -10%, rgba(91,141,212,.16), transparent 60%),
      radial-gradient(900px 520px at 100% 0%, rgba(240,150,30,.14), transparent 55%),
      linear-gradient(160deg,var(--bg-1),var(--bg-2));
    background-attachment:fixed;
    color:var(--text);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Comic Sans MS",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.78;
    padding:24px 18px 64px;
    position:relative;
  }
  /* 背景涂鸦：圆点 + 小星 */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;opacity:.5;pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(120,140,200,.18) 1.5px, transparent 2px),
      radial-gradient(circle, rgba(230,160,60,.16) 1.5px, transparent 2px);
    background-size:46px 46px, 70px 70px;
    background-position:0 0, 23px 35px;
  }
  .wrap{max-width:1280px;margin:0 auto}

  /* ===== 头部 ===== */
  header.top{
    background:linear-gradient(135deg,var(--theme),var(--theme-2));
    color:#fff;border-radius:24px;padding:24px 28px;position:relative;overflow:hidden;
    box-shadow:0 16px 38px rgba(30,50,120,.30);
  }
  header.top::after{content:"✶";position:absolute;right:18px;top:6px;font-size:64px;color:rgba(255,255,255,.16);transform:rotate(12deg)}
  header.top .star{position:absolute;left:20px;bottom:8px;font-size:30px;opacity:.5}
  header.top h1{margin:0;font-size:1.6em;letter-spacing:.01em;font-weight:900;display:inline-block;
    background:rgba(255,255,255,.18);padding:4px 16px;border-radius:14px;border:2px dashed rgba(255,255,255,.5)}
  .meta{margin-top:12px;font-size:.95em;color:rgba(255,255,255,.94)}
  .tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .tag{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 13px;font-size:.82em;font-weight:700}
  .note{margin-top:14px;font-size:.84em;color:#fff;background:rgba(0,0,0,.20);border-radius:12px;padding:9px 13px;border-left:5px solid #ffe08a}

  /* ===== 导图 hero ===== */
  .map-card{
    margin-top:22px;background:var(--panel);border:2.5px dashed #d9cdb6;border-radius:24px;
    padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .map-card h2{margin:4px 8px 12px;font-size:1.08em;font-weight:900;color:#5a4a2e;display:flex;align-items:center;gap:8px}
  .map-card h2 .pin{background:#ffe08a;border-radius:8px;padding:1px 9px;font-size:.8em;transform:rotate(-3deg);border:1px solid #e7c75a}
  svg.hero{width:100%;height:auto;display:block}

  /* ===== 详细分支（手帐贴纸卡） ===== */
  .detail{margin-top:26px;display:grid;grid-template-columns:repeat(2,1fr);gap:26px 22px}
  @media(max-width:860px){.detail{grid-template-columns:1fr}}
  .branch{
    position:relative;background:var(--panel);border:2px solid var(--bc,#999);border-radius:20px;
    padding:22px 18px 16px;box-shadow:var(--shadow);transform:rotate(var(--rot,0deg));
    transition:transform .2s, box-shadow .2s;animation:pop .5s both;break-inside:avoid;page-break-inside:avoid;
  }
  .branch:hover{transform:rotate(0deg) translateY(-6px) scale(1.02);box-shadow:var(--shadow-pop)}
  @keyframes pop{from{opacity:0;transform:rotate(var(--rot,0deg)) translateY(18px) scale(.96)}to{opacity:1;transform:rotate(var(--rot,0deg))}}
  /* 胶带角 */
  .branch .tape{position:absolute;top:-12px;left:24px;width:74px;height:24px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 8px,var(--bc,#bbb) 8px 16px);opacity:.85;border:1px solid rgba(0,0,0,.06);transform:rotate(-5deg);box-shadow:0 2px 5px rgba(0,0,0,.12)}
  /* 凸起 emoji 徽章 */
  .branch .badge{position:absolute;top:-22px;right:18px;width:50px;height:50px;border-radius:50%;
    background:#fff;border:3px solid var(--bc,#999);display:flex;align-items:center;justify-content:center;
    font-size:26px;box-shadow:0 5px 12px rgba(0,0,0,.16);z-index:2}
  /* 彩色横幅标题 */
  .branch .banner{display:inline-block;background:var(--bc,#999);color:#fff;font-weight:900;font-size:1.06em;
    padding:6px 16px 6px 14px;border-radius:0 14px 14px 0;margin:-2px 0 12px -18px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .branch .banner .ix{background:rgba(255,255,255,.25);border-radius:8px;padding:0 8px;margin-right:8px;font-size:.86em}
  .branch ul{margin:6px 0 0;padding-left:0;list-style:none}
  .branch li.pt{position:relative;padding:7px 12px;margin:8px 0;background:#fbfcff;border:1.5px solid #eef1f7;border-radius:12px;line-height:1.7}
  .branch li.pt::before{content:"●";color:var(--bc,#bbb);font-size:.7em;margin-right:8px;vertical-align:middle}
  .branch li.pt.key{background:var(--key-soft);border-color:#f0d488}
  .branch li.pt.key::before{content:"★";color:var(--key);font-size:.95em;margin-right:6px}
  .branch .pt.tip{background:#fff6e8;border-color:#f3d9a8;font-size:.9em;color:#7a5a2e}
  .branch .pt.tip b{color:#5a3e12}

  footer{margin-top:28px;font-size:.82em;color:#8a8f9c;text-align:center}
  .print-note{display:none}
  .float{position:absolute;font-size:26px;opacity:.5;pointer-events:none;animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}

  @page{size:A4 landscape;margin:12mm}
  @media print{
    body{background:#fff !important;color:#000;padding:0;font-size:11pt}
    body::before{display:none}
    header.top,.map-card,.branch{box-shadow:none;transform:none !important}
    .branch{border:1.5px solid #aaa;animation:none}
    .branch .tape{display:none}
    .branch .badge{border:2px solid #aaa}
    .map-card{border:1.5px solid #aaa}
    .float{display:none}
    .print-note{display:block;font-size:.8em;color:#444;margin:0 0 8px}
    .detail{gap:12px}
  }

<body>
<div class="wrap" id="wrap">

  <header class="top">
    <span class="star">✦</span>
    <h1 id="gTitle">知识图谱</h1>
    <div class="meta" id="gSub">副标题</div>
    <div class="tags" id="gTags"></div>
    <div class="note" id="gNote"></div>
  </header>

  <section class="map-card">
    <h2><span class="pin">导图速览</span> 中心节点 + 彩色分支（由远及近、由外到内）</h2>
    <svg class="hero" id="hero" viewBox="0 0 1400 980" role="img" aria-label="知识图谱"></svg>
  </section>

  <section class="detail" id="detail"></section>

  <div class="print-note">打印提示：纸张选 A4 横向，缩放选"实际大小"（关闭"适应页面"）。导图可单独打印首页，贴纸卡作复习速览。</div>
  <footer id="gFoot">本图谱依据教材整理，供课前导学 / 单元复习使用；具体表述与页码请按所用教材版本核对。</footer>

</div>

<script>
/* =========================================================================
   GRAPH 数据：换成你的知识点即可（字段说明见文件头注释）
   ========================================================================= */
const GRAPH = {
  title: "《地球的宇宙环境》学习知识图谱",
  subtitle: "高中地理 · 必修 · 人教版 必修第一册 · 第一章 第一节（教材 P1–7）",
  tags: ["学段：高中（必修）", "学科：地理", "形态：知识图谱", "风格：贴纸·手帐·生动"],
  note: "⚠ 请按所用教材版本核对：本图谱依据人教版 地理 必修第一册（2019版）第一章 第一节《地球的宇宙环境》（教材 P1–7）整理；细节表述与页码以手头教材为准。",
  theme: "#3b6fd4", theme2: "#1f3c7a",
  center: { emoji: "🌍", label: "地球的\n宇宙环境", sub: "第一章 · 第一节" },
  branches: [
    { ix:"①", icon:"🌟", title:"天体（概念·类型）", color:"#4f8cff", sub:"宇宙间物质存在形式；最基本：恒星·星云",
      points:[
        {text:"概念：宇宙间物质存在的形式，统称天体。"},
        {text:"常见自然天体：恒星 / 星云 / 行星 / 卫星 / 流星体 / 彗星。"},
        {text:"最基本的天体：恒星和星云。", key:true},
        {text:"自然 vs 人造：人造卫星、空间站、飞船不算自然天体。"}
      ]},
    { ix:"②", icon:"🌀", title:"天体系统（层次）", color:"#19bccb", sub:"地月系→太阳系→银河系→可观测宇宙",
      points:[
        {text:"概念：运动中的天体相互吸引、相互绕转，形成天体系统。"},
        {text:"层次（由低到高）：地月系 → 太阳系 → 银河系 → 可观测宇宙。", key:true},
        {text:"太阳系：太阳为质量占 99.86% 的中心天体；日地距约 1.5 亿 km。"},
        {text:"可观测宇宙 = 银河系 + 河外星系（二者同级）。"}
      ],
      tip:"易混：光年是距离单位（光一年走的距离），不是时间单位。"},
    { ix:"③", icon:"🪐", title:"太阳系与八大行星", color:"#e59410", sub:"距日顺序·分类·三性·小行星带",
      points:[
        {text:"八大行星（距日由近及远）：水·金·地·火·木·土·天·海。"},
        {text:"分类：类地行星（水金地火）、巨行星（木土）、远日行星（天海）。"},
        {text:"运动特征（三性）：同向性、共面性、近圆性。", key:true},
        {text:"小行星带位于火星与木星轨道之间；哈雷彗星 76 年回归。"}
      ]},
    { ix:"④", icon:"🌍", title:"地球是普通的行星", color:"#43b02a", sub:"类地行星·运动特征一致",
      points:[
        {text:"结构特征相近：与类地行星（水金地火）在距日远近、体积、质量上相似。"},
        {text:"运动特征一致：同样具有同向性、共面性、近圆性。"},
        {text:"结论：地球只是太阳系中一颗普通的行星。", key:true}
      ]},
    { ix:"⑤", icon:"💧", title:"地球是特殊的行星·存在生命", color:"#ef5b8d", sub:"外部条件 + 自身金锁链",
      points:[

/* =========================================================================
   渲染逻辑（一般无需改动）
   ========================================================================= */
function lighten(hex, amt){ // 生成浅色底纹
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);
  return "rgb("+r+","+g+","+b+")";
}
function svgText(escaped){return escaped.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderHeader(){
  document.documentElement.style.setProperty("--theme", GRAPH.theme);
  document.documentElement.style.setProperty("--theme-2", GRAPH.theme2);
  document.getElementById("gTitle").textContent = GRAPH.title;
  document.getElementById("gSub").textContent = GRAPH.subtitle || "";
  document.getElementById("gNote").textContent = GRAPH.note || "";
  document.getElementById("gFoot").textContent = GRAPH.note || document.getElementById("gFoot").textContent;
  const tg = document.getElementById("gTags");
  (GRAPH.tags||[]).forEach(function(t){const s=document.createElement("span");s.className="tag";s.textContent=t;tg.appendChild(s);});
}

function renderHero(){
  const svg = document.getElementById("hero");
  const cx=700, cy=470, R=360;
  const N = GRAPH.branches.length;
  const W=234, H=62;
  let s = "";
  // 装饰星
  const stars=[[120,90,"✶"],[1280,120,"✦"],[160,860,"✺"],[1230,840,"✶"],[700,40,"★"],[60,470,"✦"]];
  stars.forEach(function(st){ s+='<text x="'+st[0]+'" y="'+st[1]+'" font-size="30" fill="#cdb27a" opacity=".55">'+st[2]+'</text>'; });
  // 连线（曲线胶带）+ 分支节点
  GRAPH.branches.forEach(function(b,i){
    const ang = (-90 + i*(360/N)) * Math.PI/180;
    const nx = cx + R*Math.cos(ang), ny = cy + R*Math.sin(ang);
    // 控制点：中点垂直偏移，形成柔和曲线
    const mx=(cx+nx)/2, my=(cy+ny)/2;
    const dx=nx-cx, dy=ny-cy, len=Math.hypot(dx,dy)||1;
    const px=-dy/len*40, py=dx/len*40;
    s+='<path d="M'+cx+','+cy+' Q'+(mx+px)+','+(my+py)+' '+nx+','+ny+'" fill="none" stroke="'+b.color+'" stroke-width="7" stroke-linecap="round" opacity=".75"/>';
    // 节点（圆角贴纸 + emoji + 标题）
    const x=nx-W/2, y=ny-H/2;
    s+='<g>';
    s+='<rect x="'+x+'" y="'+y+'" width="'+W+'" height="'+H+'" rx="30" fill="'+lighten(b.color,.82)+'" stroke="'+b.color+'" stroke-width="3"/>';
    s+='<text x="'+(x+34)+'" y="'+(ny+9)+'" font-size="28" text-anchor="middle">'+b.icon+'</text>';
    s+='<text x="'+(x+58)+'" y="'+(ny+9)+'" font-size="18" font-weight="800" fill="'+b.color+'">'+svgText(b.title.replace(/（.*?）/g,""))+'</text>';
    s+='</g>';
  });
  // 中心发光星球
  s+='<defs><radialGradient id="orb" cx="50%" cy="38%" r="62%">'+
     '<stop offset="0%" stop-color="#bfe0ff"/><stop offset="60%" stop-color="'+GRAPH.theme+'"/><stop offset="100%" stop-color="'+GRAPH.theme2+'"/></radialGradient></defs>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="70" fill="url(#orb)" stroke="#fff" stroke-width="4"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="84" fill="none" stroke="'+GRAPH.theme+'" stroke-width="2" stroke-dasharray="6 8" opacity=".5"/>';
  s+='<text x="'+cx+'" y="'+(cy-6)+'" font-size="40" text-anchor="middle">'+GRAPH.center.emoji+'</text>';
  const labs=String(GRAPH.center.label).split("\n");
  labs.forEach(function(ln,k){ s+='<text x="'+cx+'" y="'+(cy+26+k*20)+'" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">'+svgText(ln)+'</text>'; });
  s+='<text x="'+cx+'" y="'+(cy+92)+'" font-size="13" fill="#dfe9ff" text-anchor="middle">'+svgText(GRAPH.center.sub||"")+'</text>';
  svg.innerHTML = s;
}

function renderDetail(){
  const det = document.getElementById("detail");
  GRAPH.branches.forEach(function(b,i){
    const rot = (i%2===0? -1.4 : 1.4); // 交错轻微旋转，手帐感
    const art = document.createElement("article");
    art.className="branch"; art.style.setProperty("--bc", b.color); art.style.setProperty("--rot", rot+"deg");
    art.style.animationDelay = (i*0.06)+"s";
    let html = '<div class="tape"></div><div class="badge">'+b.icon+'</div>';
    html += '<div class="banner"><span class="ix">'+b.ix+'</span>'+b.title+'</div>';
    html += '<ul>';
    (b.points||[]).forEach(function(p){
      html += '<li class="pt'+(p.key?' key':'')+'">'+svgText(p.text)+'</li>';
    });
    html += '</ul>';
    if(b.tip) html += '<div class="pt tip"><b>易混 / 提示：</b>'+svgText(b.tip)+'</div>';
    art.innerHTML = html;
    det.appendChild(art);
  });
  // 漂浮装饰
  const wrap=document.getElementById("wrap");
  ["✶","✦","✺","★","❀","✸"].forEach(function(e,i){
    const f=document.createElement("div"); f.className="float"; f.textContent=e;
    f.style.right=(5+i*7)+"%"; f.style.top=(12+i*10)+"%"; f.style.left=""; f.style.animationDelay=(i*0.7)+"s";
    wrap.appendChild(f);
  });
}

renderHeader();
renderHero();
renderDetail();
document.title = GRAPH.title + " · 知识图谱";
</script>
